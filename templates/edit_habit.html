{% extends "base.html" %}

{% block content %}
  <section class="form-panel">
    <h2>Edit Habit</h2>
    <form action="{{ url_for('edit_habit', habit_id=habit.id) }}" method="post">
      <label>
        Name
        <input type="text" name="name" value="{{ habit.name }}" required />
      </label>
      <label>
        Description
        <textarea name="description" rows="3">{{ habit.description }}</textarea>
      </label>
      <label>
        Category
        <input type="text" name="category" value="{{ habit.category }}" required />
      </label>
      <input type="hidden" name="created_at" value="{{ habit.created_at }}" />
      <div class="form-actions">
        <button class="button primary" type="submit">Update Habit</button>
        <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
